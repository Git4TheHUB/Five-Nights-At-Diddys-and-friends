<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Five Nights at Diddy's</title>
    <link href="//fonts.googleapis.com/css?family=Press+Start+2P&subset=latin,greek" rel="stylesheet" type="text/css">
    <link rel="stylesheet" href="stylesheets/main.css">
</head>
<body>
    <!-- All your original audio and HTML elements here – unchanged -->

    <script type="text/javascript" src="js/jquery-2.2.4.js"></script>
    <script type="text/javascript" src="js/scratch-js.js"></script>
    <script type="text/javascript" src="js/app.js"></script>
    <script>
        // Your original night/call logic – unchanged
        var getNight = parseInt(localStorage.getItem('night'));
        var night = getNight || 1;
        $('#night-counter').html(night);

        if (night <= 1) {
            setTimeout(function() {
                $('#call'+night).get(0).play();
                $('.mute-call').fadeIn();
            }, 27000);
        }
        if (night >= 2 && night < 6) {
            setTimeout(function() {
                $('#call'+night).get(0).play();
                $('.mute-call').fadeIn();
            }, 4000);
        }

        // GAMEPAD / JOY-CON SUPPORT – FIXED MAPPINGS
        var gameOver = false;

        // Detect game over via audio playback (jumpscare, power out, static)
        document.getElementById('scare').addEventListener('play', () => { gameOver = true; });
        document.getElementById('powerout-sound').addEventListener('play', () => { gameOver = true; });
        document.getElementById('gameover-static').addEventListener('play', () => { gameOver = true; });

        // Reset on transition screen visibility change (if applicable)
        const transitionObserver = new MutationObserver(() => {
            if ($('.transition').is(':visible')) gameOver = false;
        });
        transitionObserver.observe(document.querySelector('.transition') || document.body, { attributes: true, childList: true, subtree: true });

        let prevButtons = {};
        let prevAxes = {};

        function isJoyCon(gp) {
            if (!gp) return false;
            const id = gp.id.toLowerCase();
            return id.includes('joy-con') || id.includes('switch') || id.includes('057e');
        }

        function getCameraLinks() {
            return $('.camera-menu ul li a');
        }

        function nextCamera() {
            const links = getCameraLinks();
            if (links.length < 1) return;
            let current = -1;
            links.each((i, el) => { if ($(el).parent().hasClass('active')) current = i; });
            if (current === -1) return;
            const nextIdx = (current + 1) % links.length;
            $(links[nextIdx]).trigger('click');
        }

        function prevCamera() {
            const links = getCameraLinks();
            if (links.length < 1) return;
            let current = -1;
            links.each((i, el) => { if ($(el).parent().hasClass('active')) current = i; });
            if (current === -1) return;
            const prevIdx = (current - 1 + links.length) % links.length;
            $(links[prevIdx]).trigger('click');
        }

        function pollGamepads() {
            const gamepads = navigator.getGamepads ? navigator.getGamepads() : [];
            let aggButtons = new Array(16).fill(false);
            let aggAxes = new Array(4).fill(0);

            gamepads.forEach(gp => {
                if (!gp || !isJoyCon(gp)) return;
                gp.buttons.forEach((btn, i) => { if (btn.pressed) aggButtons[i] = true; });
                gp.axes.forEach((ax, i) => { if (Math.abs(ax) > 0.1) aggAxes[i] = ax; });
            });

            const gp = { buttons: aggButtons, axes: aggAxes };
            const key = 'agg';
            if (!prevButtons[key]) {
                prevButtons[key] = new Array(16).fill(false);
                prevAxes[key] = new Array(4).fill(0);
            }
            const prev = prevButtons[key];
            const prevAx = prevAxes[key];

            if (gameOver) {
                // Block inputs, but keep updating prev to avoid stuck triggers
                prevButtons[key] = [...gp.buttons];
                prevAxes[key] = [...gp.axes];
                requestAnimationFrame(pollGamepads);
                return;
            }

            // ZL (6) → toggle LEFT door
            if (gp.buttons[6] && !prev[6]) toggleLeftDoor();

            // ZR (7) → toggle RIGHT door
            if (gp.buttons[7] && !prev[7]) toggleRightDoor();

            // Hold L (4) → LEFT light
            if (gp.buttons[4]) {
                if (!prev[4]) $('#left-light-toggle').trigger('mousedown');
            } else if (prev[4]) {
                $('#left-light-toggle').trigger('mouseup');
            }

            // Hold R (5) → RIGHT light
            if (gp.buttons[5]) {
                if (!prev[5]) $('#right-light-toggle').trigger('mousedown');
            } else if (prev[5]) {
                $('#right-light-toggle').trigger('mouseup');
            }

            // + (9) or - (8) → toggle camera
            if ((gp.buttons[9] && !prev[9]) || (gp.buttons[8] && !prev[8])) {
                cameraState();
            }

            // Camera switch: Left stick X (axis 0) or D-pad (14=right/15? wait 14=left, 15=right)
            if ($('.camera-menu').is(':visible')) {
                let dir = 0;
                if (gp.buttons[15] && !prev[15]) dir = 1;   // D-pad right
                if (gp.buttons[14] && !prev[14]) dir = -1;  // D-pad left

                const leftX = gp.axes[0];
                if (leftX > 0.6 && prevAx[0] <= 0.6) dir = 1;
                if (leftX < -0.6 && prevAx[0] >= -0.6) dir = -1;

                if (dir === 1) nextCamera();
                if (dir === -1) prevCamera();
            }

            // B (0) → mute call
            if (gp.buttons[0] && !prev[0]) muteCall();

            // Save state
            prevButtons[key] = [...gp.buttons];
            prevAxes[key] = [...gp.axes];

            requestAnimationFrame(pollGamepads);
        }

        window.addEventListener('gamepadconnected', e => {
            console.log('Joy-Con connected:', e.gamepad.id);
            pollGamepads();
        });

        setTimeout(() => {
            if (navigator.getGamepads && Array.from(navigator.getGamepads()).some(isJoyCon)) pollGamepads();
        }, 1000);

        // Debug helper (paste in console F12)
        /*
        setInterval(() => {
            navigator.getGamepads().forEach((gp, i) => {
                if (gp && isJoyCon(gp)) {
                    console.log(`Pad ${i}: ${gp.id}`);
                    gp.buttons.forEach((b,j) => b.pressed && console.log(`Btn ${j}`));
                    gp.axes.forEach((v,j) => Math.abs(v)>0.2 && console.log(`Axis ${j}: ${v}`));
                }
            });
        }, 300);
        */
    </script>
</body>
</html>
