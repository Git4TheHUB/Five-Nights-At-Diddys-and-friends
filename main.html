    <script>
        var getNight = parseInt(localStorage.getItem('night'));
        var night = getNight || 1;
        $('#night-counter').html(night);

        if (night <= 1) {
            setTimeout(function() {
                $('#call'+night+'').get(0).play();
                $('.mute-call').fadeIn();
            }, 27000);
        }
        if (night >= 2 && night < 6) {
            setTimeout(function() {
                $('#call'+night+'').get(0).play();
                $('.mute-call').fadeIn();
            }, 4000);
        }

        // === GAMEPAD / JOY-CON SUPPORT ========================================

        // Assume gameOver is set to true on death/jumpscare in app.js
        // If not already present, add: var gameOver = false; globally in app.js
        // and set gameOver = true; when player loses

        var gameOver = false;  // CHANGE THIS LINE if you already have gameOver in app.js

        let prevState = {}; // per gamepad previous button/axis state

        function isJoyCon(gp) {
            if (!gp) return false;
            const id = (gp.id || '').toLowerCase();
            return id.includes('joy-con') || id.includes('switch') || id.includes('057e');
        }

        function getActiveCameras() {
            return $('.camera-menu ul li a');
        }

        function switchCamera(delta) {
            const cams = getActiveCameras();
            if (cams.length === 0) return;

            let currentIndex = -1;
            cams.each(function(i) {
                if ($(this).parent().hasClass('active')) currentIndex = i;
            });

            if (currentIndex === -1) return;

            let nextIndex = (currentIndex + delta + cams.length) % cams.length;
            cams.eq(nextIndex).get(0).click();  // triggers your existing cam switch
        }

        function pollGamepads() {
            const gps = navigator.getGamepads ? navigator.getGamepads() : [];

            for (let i = 0; i < gps.length; i++) {
                const gp = gps[i];
                if (!gp || !isJoyCon(gp)) continue;

                const idx = gp.index;
                if (!prevState[idx]) {
                    prevState[idx] = {
                        buttons: new Array(gp.buttons.length).fill(false),
                        axes: new Array(gp.axes.length).fill(0)
                    };
                }
                const prev = prevState[idx];

                if (gameOver) {
                    // Block all game controls after death
                    continue;
                }

                // ─── Door toggles (ZL / ZR) ────────────────
                // Common indices: ZL ~6-7, ZR ~7-6 depending on left/right
                const zlPressed = gp.buttons[6]?.pressed || gp.buttons[7]?.pressed || false;
                const zrPressed = gp.buttons[7]?.pressed || gp.buttons[6]?.pressed || false;

                if (zlPressed && !prev.buttons[6] && !prev.buttons[7]) {
                    toggleLeftDoor();
                }
                if (zrPressed && !prev.buttons[7] && !prev.buttons[6]) {
                    toggleRightDoor();
                }

                // ─── Lights (hold L / R) ───────────────────
                // L ~4, R ~5
                const holdL = gp.buttons[4]?.pressed || false;
                const holdR = gp.buttons[5]?.pressed || false;

                // Simulate hold by repeated "press" while held (common FNAF pattern)
                if (holdL) {
                    // turn left light on - adjust if your light uses different logic
                    if (!prev.buttons[4]) document.querySelector('#left-light-toggle').click();
                } else if (prev.buttons[4]) {
                    // release → off
                    document.querySelector('#left-light-toggle').click();
                }

                if (holdR) {
                    if (!prev.buttons[5]) document.querySelector('#right-light-toggle').click();
                } else if (prev.buttons[5]) {
                    document.querySelector('#right-light-toggle').click();
                }

                // ─── Camera toggle (+ / −) ─────────────────
                const plus  = gp.buttons[9]?.pressed || false;
                const minus = gp.buttons[8]?.pressed || false;

                if ((plus || minus) && (!prev.buttons[9] && !prev.buttons[8])) {
                    cameraState();
                }

                // ─── Camera change (right stick or D-pad) ──
                if ($('.camera-menu').is(':visible')) {   // or use your isCameraOpen variable
                    let dir = 0;

                    // D-pad (common indices 12-15)
                    if (gp.buttons[15]?.pressed && !prev.buttons[15]) dir = 1;   // right
                    if (gp.buttons[14]?.pressed && !prev.buttons[14]) dir = -1;  // left

                    // Right stick X (axis 2 common for right stick)
                    const rsx = gp.axes[2] || 0;
                    if (rsx > 0.65 && prev.axes[2] <= 0.65) dir = 1;
                    if (rsx < -0.65 && prev.axes[2] >= -0.65) dir = -1;

                    if (dir !== 0) {
                        switchCamera(dir);
                    }
                }

                // ─── Title screen / menu navigation ────────
                // (A=1, B=0, X=3, Y=2 common face buttons; D-pad 12-15)
                // Adjust selectors to match your actual menu buttons if needed
                if ($('.transition').is(':visible') || $('.preloader').is(':visible') || !$('.container').is(':visible')) {
                    // Example: assume menu has .menu-item.active or similar
                    const menuItems = $('.menu-item, .start-button, button, a[href*="start"]'); // ← customize!

                    if (menuItems.length > 0) {
                        let menuDir = 0;
                        if (gp.buttons[15]?.pressed && !prev.buttons[15]) menuDir = 1; // right/down
                        if (gp.buttons[13]?.pressed && !prev.buttons[13]) menuDir = 1;
                        if (gp.buttons[14]?.pressed && !prev.buttons[14]) menuDir = -1;
                        if (gp.buttons[12]?.pressed && !prev.buttons[12]) menuDir = -1;

                        if (menuDir !== 0) {
                            // simple cycle highlight (you may need better logic)
                            let curr = menuItems.filter('.active, :focus');
                            let idx = menuItems.index(curr);
                            let nextIdx = (idx + menuDir + menuItems.length) % menuItems.length;
                            menuItems.eq(nextIdx).focus().addClass('active').siblings().removeClass('active');
                        }

                        // Confirm / start (A or +)
                        if ((gp.buttons[1]?.pressed || gp.buttons[9]?.pressed) && !prev.buttons[1] && !prev.buttons[9]) {
                            // simulate click on active/start button
                            $('.start-button, .menu-item.active, #new-game, button:contains("Start")').click();
                        }
                    }
                }

                // Save current state
                for (let b = 0; b < gp.buttons.length; b++) {
                    prev.buttons[b] = gp.buttons[b]?.pressed || false;
                }
                for (let a = 0; a < gp.axes.length; a++) {
                    prev.axes[a] = gp.axes[a] || 0;
                }
            }

            requestAnimationFrame(pollGamepads);
        }

        window.addEventListener('gamepadconnected', e => {
            console.log('Joy-Con connected:', e.gamepad.id);
            pollGamepads(); // ensure loop runs
        });

        // Start polling (in case already connected)
        setTimeout(() => {
            if (navigator.getGamepads?.().some(g => g)) pollGamepads();
        }, 1000);

        // Debug tip: open console and paste this to see pressed buttons/axes live

                    console.log(`Pad ${i} (${gp.id}):`);
                    gp.buttons.forEach((b,j) => { if (b.pressed) console.log(`  Btn ${j}`); });
                    gp.axes.forEach((v,j) => { if (Math.abs(v)>0.1) console.log(`  Axis ${j}: ${v.toFixed(2)}`); });
                }
            });
        }, 300);
        */

    </script>
