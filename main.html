        <!-- Top Menu-->

        <audio preload="auto" class="door-light-disabled" src="resources/audio/error.wav"></audio>

        <!-- Left Door & Switch -->
        <div class="left to-hide">

                <img src="resources/img/doors/left_door_1.png" class="default" alt="Left door">
            </div>
            <div class="left-switch">
                <img 
                    src="resources/img/rooms/left_switch_door_0_light_0.png" 
                    alt="Left switch panel" 
                    usemap="#left-door-switch"
                >
                <map name="left-door-switch" id="left-door-switch">
                    <area 
                        alt="Door Switch" 
                        title="Toggle left door" 
                        href="javascript:toggleLeftDoor();" 
                        coords="31,53,69,107" 
                        shape="rect"
                    >
                    <area 
                        id="left-light-toggle" 
                        alt="Light Switch" 
                        title="Light Switch (Hold to On)" 
                        href="javascript:;" 
                        coords="31,134,69,187" 
                        shape="rect"
                    >
                </map>
            </div>
        </div>

        <!-- Right Door & Switch -->
        <div class="right to-hide">
            <div class="right-door">
                <img src="resources/img/doors/right_door_1.png" alt="Right door">
            </div>
            <div class="right-switch">
                <img 
                    src="resources/img/rooms/right_switch_door_0_light_0.png" 
                    alt="Right switch panel" 
                    usemap="#right-door-switch"
                >
                <map name="right-door-switch" id="right-door-switch">
                    <area 
                        alt="Door Switch" 
                        title="Toggle right door" 
                        href="javascript:toggleRightDoor();" 
                        coords="24,53,62,107" 
                        shape="rect"
                    >
                    <area 
                        id="right-light-toggle" 
                        alt="Light Switch" 
                        title="Light Switch (Hold to On)" 
                        href="javascript:;" 
                        coords="23,133,63,187" 
                        shape="rect"
                    >
                </map>
            </div>
        </div>

        <!-- Camera Menu-->
        <div class="camera-menu">
            <div id="camera-record"><img src="resources/img/cams/record_button.png" alt=""></div>
            <div id="camera-bg1"><img src="" alt=""></div>

            <!-- camera screen -->
            <div id="camera-bg3"><img src="resources/img/cams/camera_screen.png" alt=""></div>
            <!-- camera map -->
            <p id="camera-id">Showstage</p>
            <img id="cameras" src="resources/img/game/camera_map.png">
            <div class="static"></div>
            <ul>
                <li class="active">
                    <a href="javascript:;" data-camname="Showstage" id="cam1a">CAM<br>1A<audio preload="auto" class="camera-cycle" src="resources/audio/blip3.wav"></audio></a>
                </li>
                <li class="">
                    <a href="javascript:;" data-camname="Dining Area" id="cam1b">CAM<br>1B<audio preload="auto" class="camera-cycle" src="resources/audio/blip3.wav"></audio></a>
                </li>
                <li class="">
                    <a href="javascript:;" data-camname="Backstage" id="cam5">CAM<br>5<audio preload="auto" class="camera-cycle" src="resources/audio/blip3.wav"></audio></a>
                </li>
                <li class="">
                    <a href="javascript:;" data-camname="Pirate Cove" id="cam1c">CAM<br>1C<audio preload="auto" class="camera-cycle" src="resources/audio/blip3.wav"></audio></a>
                </li>
                <li class="">
                    <a href="javascript:;" data-camname="Supply Closet" id="cam3">CAM<br>3<audio preload="auto" class="camera-cycle" src="resources/audio/blip3.wav"></audio></a>
                </li>
                <li class="">
                    <a href="javascript:;" data-camname="West Hall" id="cam2a">CAM<br>2A<audio preload="auto" class="camera-cycle" src="resources/audio/blip3.wav"></audio></a>
                </li>
                <li class="">
                    <a href="javascript:;" data-camname="West Hall Corner" id="cam2b">CAM<br>2B<audio preload="auto" class="camera-cycle" src="resources/audio/blip3.wav"></audio></a>
                </li>
                <li class="">
                    <a href="javascript:;" data-camname="East Hall Corner" id="cam4b">CAM<br>4B<audio preload="auto" class="camera-cycle" src="resources/audio/blip3.wav"></audio></a>
                </li>
                <li class="">
                    <a href="javascript:;" data-camname="East Hall" id="cam4a">CAM<br>4A<audio preload="auto" class="camera-cycle" src="resources/audio/blip3.wav"></audio></a>
                </li>
                <li class="">
                    <a href="javascript:;" data-camname="Kitchen" id="cam6">CAM<br>6<audio preload="auto" class="camera-cycle" src="resources/audio/blip3.wav"></audio></a>
                </li>
                <li class="">
                    <a href="javascript:;" data-camname="Rest Rooms" id="cam7">CAM<br>7<audio preload="auto" class="camera-cycle" src="resources/audio/blip3.wav"></audio></a>
                </li>
            </ul>
        </div>

        <div id="camera-bg2"><img src="" alt="" class="display-0"></div>

        <!-- control-menu -->
        <div class="control to-hide">
            <div class="control-usage">
                <p class="power">Power left: <span id="power-counter">100</span>%</p>
                <p class="usage">Usage: <span id="usage-counter"><img src="resources/img/game/batt_usage_1.png" alt=""></span></p>
            </div>
            <a href="javascript:;" onclick="cameraState();"><img id="toggle-camera" src="resources/img/game/camera_toggle.png"><audio preload="auto" class="camera-toggle" src="resources/audio/CAMERA_VIDEO_LOA_60105303.wav"></audio></a>
        </div>

    <script type="text/javascript" src="js/jquery-2.2.4.js"></script>
    <script type="text/javascript" src="js/scratch-js.js"></script>
    <script type="text/javascript" src="js/app.js"></script>
    <script>
        var getNight = parseInt(localStorage.getItem('night'));
        var night = getNight || 1;
        $('#night-counter').html(night);

        if (night <= 1) {
            setTimeout(function() {
                $('#call'+night+'').get(0).play();
                $('.mute-call').fadeIn();
            }, 27000);
        }
        if (night >= 2 && night < 6) {
            setTimeout(function() {
                $('#call'+night+'').get(0).play();
                $('.mute-call').fadeIn();
            }, 4000);
        }

        // ────────────────────────────────────────────────
        //   Joy-Con / Gamepad Support – NO CHANGES NEEDED
        // ────────────────────────────────────────────────

        let prevButtons = {};           // per gamepad button states
        let leftLightOn = false;
        let rightLightOn = false;
        let lastRightStickX = 0;

        // Most common Joy-Con mappings (Chrome/Edge Bluetooth – right Joy-Con usually)
        // Left Joy-Con often has similar but shifted indices
        const BUTTON = {
            // Right Joy-Con common
            A:       1,
            B:       0,
            X:       3,
            Y:       2,
            R:       5,      // shoulder
            ZR:      7,      // trigger
            PLUS:    9,
            MINUS:   8,      // sometimes on right
            RS:      11,     // right stick click
            DPAD_UP:    12,
            DPAD_DOWN:  13,
            DPAD_LEFT:  14,
            DPAD_RIGHT: 15,

            // Left Joy-Con common
            L:       4,
            ZL:      6
        };

        function isJoyConOrSwitch(gp) {
            if (!gp) return false;
            const id = gp.id.toLowerCase();
            return id.includes('joy-con') || id.includes('switch') || id.includes('057e-2006') || id.includes('057e-2007');
        }

        function pollGamepads() {
            const gamepads = navigator.getGamepads ? navigator.getGamepads() : [];

            for (let i = 0; i < gamepads.length; i++) {
                const gp = gamepads[i];
                if (!gp || !isJoyConOrSwitch(gp)) continue;

                const idx = gp.index;
                if (!prevButtons[idx]) {
                    prevButtons[idx] = { buttons: new Array(gp.buttons.length).fill(false), rsx: 0 };
                }

                const prev = prevButtons[idx];

                // ─── ZL / ZR  ── toggle doors (on press only) ────────
                if (gp.buttons[BUTTON.ZL]?.pressed && !prev.buttons[BUTTON.ZL]) {
                    toggleLeftDoor();
                }
                if (gp.buttons[BUTTON.ZR]?.pressed && !prev.buttons[BUTTON.ZR]) {
                    toggleRightDoor();
                }

                // ─── Hold L / R  ── lights (hold = on, release = off) ───
                const wantLeft  = !!gp.buttons[BUTTON.L]?.pressed;
                const wantRight = !!gp.buttons[BUTTON.R]?.pressed;

                if (wantLeft !== leftLightOn) {
                    leftLightOn = wantLeft;
                    if (leftLightOn) {
                        // Replace with your actual left light ON function if different
                        document.querySelector('#left-light-toggle').click(); // simulates click → hold behavior
                    } else {
                        document.querySelector('#left-light-toggle').click(); // toggle off
                    }
                }

                if (wantRight !== rightLightOn) {
                    rightLightOn = wantRight;
                    if (rightLightOn) {
                        document.querySelector('#right-light-toggle').click();
                    } else {
                        document.querySelector('#right-light-toggle').click();
                    }
                }

                // ─── + or −  ── toggle camera system ─────────────────
                if ((gp.buttons[BUTTON.PLUS]?.pressed && !prev.buttons[BUTTON.PLUS]) ||
                    (gp.buttons[BUTTON.MINUS]?.pressed && !prev.buttons[BUTTON.MINUS])) {
                    cameraState();
                }

                // ─── Right stick / D-pad  ── switch cameras (when open) ───
                // Check if camera menu is visible (adjust selector if needed)
                if ($('.camera-menu').is(':visible') || !document.querySelector('.camera-menu.display-0')) {

                    let direction = 0;

                    // D-pad
                    if (gp.buttons[BUTTON.DPAD_RIGHT]?.pressed && !prev.buttons[BUTTON.DPAD_RIGHT]) direction = 1;
                    if (gp.buttons[BUTTON.DPAD_LEFT]?.pressed  && !prev.buttons[BUTTON.DPAD_LEFT])  direction = -1;

                    // Right analog stick horizontal
                    const rsx = gp.axes[2] || 0;   // axis 2 = right stick X (common)
                    if (rsx > 0.6 && prev.rsx <= 0.6) direction = 1;
                    if (rsx < -0.6 && prev.rsx >= -0.6) direction = -1;

                    if (direction !== 0) {
                        // Simulate next/prev camera click – adjust selectors to match your cam change logic
                        if (direction > 0) {
                            // next camera – you may need to change this to your real next-cam function
                            document.querySelector('#cam1b')?.click() || console.log("Next cam");
                        } else {
                            document.querySelector('#cam1a')?.click() || console.log("Prev cam");
                        }
                    }

                    prev.rsx = rsx;
                }

                // Update previous states
                for (let b = 0; b < gp.buttons.length; b++) {
                    prev.buttons[b] = !!gp.buttons[b]?.pressed;
                }
            }

            requestAnimationFrame(pollGamepads);
        }

        // Start polling
        function startGamepadPolling() {
            if (navigator.getGamepads && !window.gamepadPollingActive) {
                window.gamepadPollingActive = true;
                pollGamepads();
            }
        }

        window.addEventListener('gamepadconnected', (e) => {
            console.log('Joy-Con/Gamepad connected:', e.gamepad.id);
            startGamepadPolling();
        });

        // Also check immediately (in case already connected)
        setTimeout(startGamepadPolling, 800);

        // Optional debug helper: open console (F12) and paste this to see real button indices:
        /*
        setInterval(() => {
          navigator.getGamepads().forEach((gp, i) => {
            if (gp) {
              console.log(`Gamepad ${i}: ${gp.id}`);
              gp.buttons.forEach((b, j) => { if (b.pressed) console.log(`  Button ${j} pressed`); });
            }
          });
        }, 300);
        */
    </script>
</body>
</html>
