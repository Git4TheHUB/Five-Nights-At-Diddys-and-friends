<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Five Nights at Diddy's</title>

<link href="https://fonts.googleapis.com/css?family=Press+Start+2P" rel="stylesheet">
<link rel="stylesheet" href="stylesheets/main.css">
</head>

<body>

<!-- AUDIO -->
<audio id="game-start" src="resources/audio/Buzz_Fan_Florescent2.wav" loop></audio>

<audio id="call1" src="resources/audio/voiceover1.wav"></audio>
<audio id="call2" src="resources/audio/voiceover2.wav"></audio>
<audio id="call3" src="resources/audio/voiceover3.wav"></audio>
<audio id="call4" src="resources/audio/voiceover4.wav"></audio>
<audio id="call5" src="resources/audio/voiceover5.wav"></audio>

<audio id="scare" src="resources/audio/XSCREAM.wav"></audio>
<audio id="powerout-sound" src="resources/audio/powerdown.wav"></audio>
<audio id="gameover-static" src="resources/audio/static.wav"></audio>

<!-- TRANSITION -->
<div class="transition">
    <img src="resources/img/game/transition_screen.png">
    <h2 id="transition-start">12:00 AM</h2>
    <h2 id="transition-night">Night <span id="night-count">1</span></h2>
</div>

<!-- PRELOADER -->
<div class="preloader">
    <img src="resources/img/game/preloader.png">
</div>

<!-- MAIN CONTAINER -->
<div class="container">

    <div class="background">
        <img class="main-screen" src="resources/img/rooms/safe_room/safe_room_left_light_0_right_light_0.png">
    </div>

    <div class="top-menu">
        <h2><span id="hour-counter">12</span> AM</h2>
        <h2>Night <span id="night-counter">1</span></h2>
    </div>

    <div class="control">
        <p>Power left: <span id="power-counter">100</span>%</p>
        <a href="javascript:;" onclick="cameraState()">CAMERA</a>
    </div>

</div>

<!-- SCRIPTS -->
<script src="js/jquery-2.2.4.js"></script>
<script src="js/scratch-js.js"></script>
<script src="js/app.js"></script>

<script>
(function () {
"use strict";

/* ---------------------------
   SAFE NIGHT HANDLING
---------------------------- */
let storedNight = parseInt(localStorage.getItem("night"), 10);
let night = Number.isInteger(storedNight) && storedNight >= 1 && storedNight <= 5
    ? storedNight
    : 1;

$("#night-counter").text(night);
$("#night-count").text(night);

/* ---------------------------
   AUTOPLAY SAFE AUDIO START
---------------------------- */
document.addEventListener("click", function initAudio() {
    const bg = document.getElementById("game-start");
    if (bg) {
        bg.volume = 0.1;
        bg.play().catch(()=>{});
    }
    document.removeEventListener("click", initAudio);
});

/* ---------------------------
   SAFE CALL PLAYBACK
---------------------------- */
function playCall(night, delay) {
    setTimeout(() => {
        const call = document.getElementById("call" + night);
        if (call) {
            call.play().catch(()=>{});
        }
    }, delay);
}

if (night === 1) playCall(1, 27000);
if (night >= 2 && night <= 5) playCall(night, 4000);

/* ---------------------------
   GAME OVER DETECTION
---------------------------- */
let gameOver = false;

["scare","powerout-sound","gameover-static"].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.addEventListener("play", () => gameOver = true);
});

/* ---------------------------
   JOY-CON / GAMEPAD SUPPORT
---------------------------- */
let prevButtons = [];
let prevAxes = [];

function isJoyCon(gp) {
    if (!gp) return false;
    const id = gp.id.toLowerCase();
    return id.includes("joy") || id.includes("switch") || id.includes("057e");
}

function pollGamepads() {
    const pads = navigator.getGamepads ? navigator.getGamepads() : [];
    let buttons = new Array(16).fill(false);
    let axes = new Array(4).fill(0);

    for (const gp of pads) {
        if (!isJoyCon(gp)) continue;
        gp.buttons.forEach((b,i)=>{ if (b.pressed) buttons[i] = true; });
        gp.axes.forEach((a,i)=>{ axes[i] = a; });
    }

    if (!gameOver) {
        if (buttons[6] && !prevButtons[6] && window.toggleLeftDoor) toggleLeftDoor();
        if (buttons[7] && !prevButtons[7] && window.toggleRightDoor) toggleRightDoor();
        if (buttons[9] && !prevButtons[9] && window.cameraState) cameraState();
    }

    prevButtons = buttons.slice();
    prevAxes = axes.slice();

    requestAnimationFrame(pollGamepads);
}

window.addEventListener("gamepadconnected", pollGamepads);

})();
</script>

</body>
</html>
